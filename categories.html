
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico?v=2" type="image/x-icon">
  <title>YouTube - Categories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #333;
      font: 13px Arial, Helvetica, sans-serif;
    }

    .header {
      width: 960px;
      max-width: 96%;
      height: 75px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      width: 130px;
    }

    .search {
      display: flex;
      gap: 5px;
    }

    .search input {
      width: 300px;
      height: 27px;
      border: 1px solid #999;
      padding: 4px;
    }

    .search button {
      border: 1px solid #999;
      background: linear-gradient(#fff, #ddd);
      padding: 4px 14px;
      cursor: pointer;
    }

    .nav {
      background: linear-gradient(#f5f5f5, #ddd);
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #bbb;
    }

    .nav-inner {
      width: 960px;
      max-width: 96%;
      margin: auto;
      padding: 10px 0;
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 960px;
      max-width: 96%;
      margin: 25px auto;
    }

    h1 {
      font-size: 22px;
      font-weight: normal;
      margin: 0 0 18px;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border: 1px solid #ccc;
      background: #f5f5f5;
    }

    .category-button {
      border: 1px solid #aaa;
      background: linear-gradient(#fff, #ddd);
      padding: 8px 13px;
      color: #034b8a;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .category-button:hover {
      background: linear-gradient(#fff, #cce0f5);
    }

    .category-button.active {
      background: linear-gradient(#d9eaff, #a9c9e8);
      border-color: #668bb0;
      color: #222;
    }

    .section-heading {
      margin-top: 25px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
      font-size: 18px;
      font-weight: normal;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 15px;
    }

    .video {
      min-width: 0;
    }

    .video img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eee;
    }

    .video a {
      display: block;
      color: #034b8a;
      font-weight: bold;
      text-decoration: none;
      margin-top: 5px;
      line-height: 1.35;
    }

    .video a:hover {
      text-decoration: underline;
    }

    .video p {
      color: #777;
      margin: 5px 0;
    }

    #status {
      color: #777;
      padding: 15px 0;
    }

    @media(max-width: 650px) {
      .search input {
        width: 140px;
      }

      .videos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 380px) {
      .videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html">
    <img
      class="logo"
      src="https://upload.wikimedia.org/wikipedia/commons/0/05/Logo_of_YouTube_%282006-2011%29.svg"
      alt="YouTube">
  </a>

  <form class="search" action="videos.html">
    <input name="q" placeholder="Search videos...">
    <button type="submit">Search</button>
  </form>
</header>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html">Home</a>
    <a href="videos.html">Videos</a>
    <a href="channels.html">Channels</a>
    <a href="categories.html">Categories</a>
    <a href="community.html">Community</a>
  </div>
</nav>

<main class="container">

  <h1>Browse Categories</h1>

  <div class="category-list" id="categoryList">
    <button class="category-button active" data-query="music">Music</button>
    <button class="category-button" data-query="gaming">Gaming</button>
    <button class="category-button" data-query="comedy">Comedy</button>
    <button class="category-button" data-query="entertainment">Entertainment</button>
    <button class="category-button" data-query="sports">Sports</button>
    <button class="category-button" data-query="technology">Technology</button>
    <button class="category-button" data-query="news">News</button>
    <button class="category-button" data-query="movies">Movies</button>
    <button class="category-button" data-query="education">Education</button>
    <button class="category-button" data-query="animals">Animals</button>
    <button class="category-button" data-query="travel">Travel</button>
    <button class="category-button" data-query="people and blogs">People & Blogs</button>
  </div>

  <h2 class="section-heading" id="categoryTitle">Music Videos</h2>

  <div id="status">Loading videos...</div>

  <div class="videos" id="videos"></div>

</main>

<script>
  const API = "/api";

  const categoryList = document.getElementById("categoryList");
  const categoryTitle = document.getElementById("categoryTitle");
  const status = document.getElementById("status");
  const videosContainer = document.getElementById("videos");

  async function loadCategory(query, title) {
    categoryTitle.textContent = title + " Videos";
    status.textContent = "Loading videos...";
    videosContainer.replaceChildren();

    try {
      const response = await fetch(
        `${API}/videos?q=${encodeURIComponent(query)}`
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Could not load videos");
      }

      const videos = data.items || [];

      status.textContent = "";

      if (!videos.length) {
        status.textContent = "No videos found.";
        return;
      }

      videos.forEach(video => {
        const id = video.id?.videoId || video.id;
        const snippet = video.snippet;

        if (!id || !snippet) return;

        const card = document.createElement("div");
        card.className = "video";

        const image = document.createElement("img");
        image.src =
          snippet.thumbnails?.medium?.url ||
          snippet.thumbnails?.default?.url ||
          "";
        image.alt = "";

        const link = document.createElement("a");
        link.href = `watch.html?v=${encodeURIComponent(id)}`;
        link.textContent = snippet.title || "Untitled video";

        const channel = document.createElement("p");
        channel.textContent = snippet.channelTitle || "";

        card.append(image, link, channel);
        videosContainer.appendChild(card);
      });

      if (!videosContainer.children.length) {
        status.textContent = "No videos found.";
      }

    } catch (error) {
      console.error(error);
      status.textContent = "Could not load videos.";
    }
  }

  categoryList.addEventListener("click", event => {
    const button = event.target.closest(".category-button");

    if (!button) return;

    document.querySelectorAll(".category-button").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");

    const query = button.dataset.query;
    const title = button.textContent.trim();

    loadCategory(query, title);
  });

  loadCategory("music", "Music");
</script>

</body>
</html>
